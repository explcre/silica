[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "silica-bench"
dynamic = ["version"]
description = "SILICA: certified counterfactual evaluation of identifiability in unseen-language induction"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SILICA contributors" }]
dependencies = []

[project.optional-dependencies]
audit = ["scikit-learn>=1.3"]
test = ["pytest>=7"]

[project.scripts]
silica = "silica.cli:main"

[tool.setuptools.dynamic]
version = { attr = "silica.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
